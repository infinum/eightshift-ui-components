[fmt]
useTabs = true
jsxSingleQuote = true
singleQuote = true
quoteProps = "preserve"
singleAttributePerLine = true
printWidth = 180
sortImports = false
sortPackageJson = false
svelte = false
ignorePatterns = [
	".agent/**",
	".agents/**",
	".claude/**",
	".codex/**",
	".continue/**",
	".cursor/**",
	".gemini/**",
	".opencode/**",
	".pi/**",
	".roo/**",
	".windsurf/**",
	"tools/oxlint/anti-slop/**",
	"test/**",
	"tests/**",
	"vendor/**",
	"public/**",
	"dist/**",
	"font-faces/**",
]

[fmt.sortTailwindcss]
stylesheet = "./lib/style.css"

[[fmt.overrides]]
files = ["lib/icons/icons.jsx"]
options = { singleAttributePerLine = false, printWidth = 65535, objectWrap = "collapse" }
